name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Blazor WebAssembly demo
        run: dotnet publish SchoolManagementSystem.Static/SchoolManagementSystem.Static.csproj -c Release -o publish

      - name: Set base path for the site
        run: |
          WWW=publish/wwwroot
          if [ -f CNAME ]; then
            # Custom domain (CNAME): the site is served from the domain root.
            BASE="/"
            SEGMENTS=0
          else
            # Default github.io project site: served from /<repo-name>/.
            BASE="/${{ github.event.repository.name }}/"
            SEGMENTS=1
          fi
          sed -i "s#<base href=\"/\" />#<base href=\"${BASE}\" />#" "$WWW/index.html" "$WWW/404.html"
          sed -i "s#var pathSegmentsToKeep = 1;#var pathSegmentsToKeep = ${SEGMENTS};#" "$WWW/404.html"
          # Keep the custom domain set for the deployed site
          if [ -f CNAME ]; then cp CNAME "$WWW/CNAME"; fi
          # Stop Jekyll from hiding folders that start with an underscore (_framework)
          touch "$WWW/.nojekyll"
          grep -q "<base href=\"${BASE}\" />" "$WWW/index.html"
          grep -q "pathSegmentsToKeep = ${SEGMENTS};" "$WWW/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
